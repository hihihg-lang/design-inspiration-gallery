<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新粗野主义 — 设计风格画廊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Space Grotesk', sans-serif; }
        .brutal-shadow { box-shadow: 4px 4px 0 0 #000; }
        .brutal-shadow-lg { box-shadow: 8px 8px 0 0 #000; }
    </style>
    <!-- PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Design Gallery">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">

</head>
<body class="bg-[#FFF8E7] min-h-screen">
    <div id="shared-nav" data-style="26" data-name="新粗野主义" data-name-en="Neubrutalism" data-lang="zh" data-base="../"></div>

    <div class="max-w-6xl mx-auto p-8">
        <!-- Hero -->
        <section class="mb-12">
            <div class="bg-[#FF6B6B] border-4 border-black brutal-shadow-lg p-12 text-center">
                <h1 class="text-6xl font-bold text-black mb-4">大胆。粗犷。直白。</h1>
                <p class="text-xl text-black mb-8">不躲在含蓄背后的设计</p>
                <button class="bg-black text-white px-8 py-4 text-xl font-bold border-4 border-black brutal-shadow hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all cursor-pointer">
                    立即开始 →
                </button>
            </div>
        </section>

        <!-- Feature Cards -->
        <section class="grid grid-cols-3 gap-6 mb-12">
            <div class="bg-[#4ECDC4] border-4 border-black brutal-shadow p-6">
                <div class="text-5xl mb-4">01</div>
                <h3 class="text-2xl font-bold mb-2">没有渐变</h3>
                <p>只用纯色。没有阴影掩盖真实。</p>
            </div>
            <div class="bg-[#FFE66D] border-4 border-black brutal-shadow p-6">
                <div class="text-5xl mb-4">02</div>
                <h3 class="text-2xl font-bold mb-2">粗重边框</h3>
                <p>粗黑线条勾勒每一个元素。</p>
            </div>
            <div class="bg-[#A8E6CF] border-4 border-black brutal-shadow p-6">
                <div class="text-5xl mb-4">03</div>
                <h3 class="text-2xl font-bold mb-2">粗犷美学</h3>
                <p>坦然地未经打磨，并引以为傲。</p>
            </div>
        </section>

        <!-- CTA Section -->
        <section class="bg-white border-4 border-black brutal-shadow-lg p-8 mb-12">
            <div class="grid grid-cols-2 gap-8 items-center">
                <div>
                    <h2 class="text-4xl font-bold mb-4">准备好脱颖而出了吗？</h2>
                    <p class="text-lg mb-6">加入数千名选择大胆、而非乏味的人。</p>
                    <div class="flex gap-4">
                        <button class="bg-[#FF6B6B] text-black px-6 py-3 font-bold border-4 border-black brutal-shadow hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all cursor-pointer">
                            免费注册
                        </button>
                        <button class="bg-white text-black px-6 py-3 font-bold border-4 border-black brutal-shadow hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all cursor-pointer">
                            了解更多
                        </button>
                    </div>
                </div>
                <div class="bg-[#FFE66D] border-4 border-black p-6">
                    <div class="text-6xl font-bold">50K+</div>
                    <div class="text-xl">全球用户</div>
                </div>
            </div>
        </section>

        <!-- Form -->
        <section class="bg-[#E8E8E8] border-4 border-black brutal-shadow p-8 mb-12">
            <h2 class="text-3xl font-bold mb-6">联系我们</h2>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" placeholder="你的姓名" class="bg-white border-4 border-black p-4 font-bold focus:outline-none focus:ring-0">
                <input type="email" placeholder="你的邮箱" class="bg-white border-4 border-black p-4 font-bold focus:outline-none focus:ring-0">
            </div>
            <textarea placeholder="你的留言" class="w-full mt-4 bg-white border-4 border-black p-4 font-bold focus:outline-none focus:ring-0 h-32"></textarea>
            <button class="mt-4 bg-black text-white px-8 py-4 font-bold border-4 border-black brutal-shadow hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all cursor-pointer">
                发送留言 →
            </button>
        </section>

        <!-- Color Palette -->
        <section class="bg-white border-4 border-black brutal-shadow p-6 mb-12">
            <h2 class="text-2xl font-bold mb-4">配色方案</h2>
            <div class="flex gap-4">
                <div class="flex-1 h-24 bg-[#FF6B6B] border-4 border-black flex items-center justify-center font-bold">#FF6B6B</div>
                <div class="flex-1 h-24 bg-[#4ECDC4] border-4 border-black flex items-center justify-center font-bold">#4ECDC4</div>
                <div class="flex-1 h-24 bg-[#FFE66D] border-4 border-black flex items-center justify-center font-bold">#FFE66D</div>
                <div class="flex-1 h-24 bg-[#A8E6CF] border-4 border-black flex items-center justify-center font-bold">#A8E6CF</div>
                <div class="flex-1 h-24 bg-black border-4 border-black flex items-center justify-center font-bold text-white">#000000</div>
            </div>
        </section>

        <!-- Style Info -->
        <section class="bg-white border-4 border-black brutal-shadow p-6">
            <div class="grid grid-cols-2 gap-8">
                <div>
                    <h3 class="font-bold text-lg mb-4">适用场景</h3>
                    <ul class="space-y-2">
                        <li>• 创意机构</li>
                        <li>• 作品集网站</li>
                        <li>• 初创公司</li>
                        <li>• 大胆的品牌</li>
                    </ul>
                </div>
                <div>
                    <h3 class="font-bold text-lg mb-4">关键元素</h3>
                    <ul class="space-y-2">
                        <li>• 粗黑边框</li>
                        <li>• 硬投影</li>
                        <li>• 明亮纯色</li>
                        <li>• 粗体字排印</li>
                    </ul>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <div id="shared-footer" data-style="26" data-prev="25" data-prev-name="Z世代混乱" data-next="27" data-next-name="AI 原生"></div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('../sw.js').catch(() => {});
      }
    </script>

  <script src="../shared/components.js"></script>
</body>
</html>
