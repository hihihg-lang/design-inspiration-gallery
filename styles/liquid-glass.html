<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>液态玻璃 — 设计风格画廊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
        }
        .liquid-glass {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
        }
        .iridescent {
            background: linear-gradient(135deg,
                rgba(255,0,0,0.1) 0%,
                rgba(255,255,0,0.1) 20%,
                rgba(0,255,0,0.1) 40%,
                rgba(0,255,255,0.1) 60%,
                rgba(0,0,255,0.1) 80%,
                rgba(255,0,255,0.1) 100%);
        }
        @keyframes morph {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }
        .morphing { animation: morph 8s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .floating { animation: float 6s ease-in-out infinite; }
    </style>
    <!-- PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Design Gallery">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">

</head>
<body class="relative overflow-x-hidden">
    <!-- Floating blobs -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-20 left-10 w-64 h-64 bg-pink-400/30 rounded-full filter blur-3xl morphing floating"></div>
        <div class="absolute top-40 right-20 w-80 h-80 bg-cyan-400/30 rounded-full filter blur-3xl morphing floating" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-20 left-1/3 w-72 h-72 bg-purple-400/30 rounded-full filter blur-3xl morphing floating" style="animation-delay: 4s;"></div>
    </div>

    <div id="shared-nav" data-style="15" data-name="液体玻璃" data-name-en="Liquid Glass" data-lang="zh" data-base="../"></div>

    <!-- Hero -->
    <section class="relative pt-32 pb-20 px-6">
        <div class="max-w-4xl mx-auto text-center">
            <div class="liquid-glass iridescent p-12 mb-8">
                <h1 class="text-6xl font-bold text-white mb-4">流动与形变</h1>
                <p class="text-xl text-white/80">流动的形态、色散与虹彩效果</p>
            </div>
        </div>
    </section>

    <!-- Features -->
    <section class="relative py-12 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="grid grid-cols-3 gap-6">
                <div class="liquid-glass p-6 hover:bg-white/25 transition-all cursor-pointer">
                    <div class="w-16 h-16 bg-gradient-to-br from-cyan-400 to-blue-500 rounded-full mb-4 morphing"></div>
                    <h3 class="text-xl font-semibold text-white mb-2">形变</h3>
                    <p class="text-white/60 text-sm">流动变化、有机的形态</p>
                </div>
                <div class="liquid-glass p-6 hover:bg-white/25 transition-all cursor-pointer">
                    <div class="w-16 h-16 iridescent rounded-2xl mb-4" style="border: 2px solid rgba(255,255,255,0.3);"></div>
                    <h3 class="text-xl font-semibold text-white mb-2">虹彩</h3>
                    <p class="text-white/60 text-sm">如彩虹般的色彩效果</p>
                </div>
                <div class="liquid-glass p-6 hover:bg-white/25 transition-all cursor-pointer">
                    <div class="w-16 h-16 bg-white/20 backdrop-blur-xl rounded-2xl mb-4 border border-white/40"></div>
                    <h3 class="text-xl font-semibold text-white mb-2">半透明</h3>
                    <p class="text-white/60 text-sm">深度模糊与光线折射</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Colors -->
    <section class="relative py-12 px-6">
        <div class="max-w-5xl mx-auto">
            <h3 class="text-white/50 text-sm uppercase tracking-widest mb-8 text-center">色彩效果</h3>
            <div class="liquid-glass p-8">
                <div class="h-32 rounded-2xl mb-4 iridescent" style="background-size: 200% 200%; animation: aurora 5s ease infinite;"></div>
                <p class="text-white/60 text-sm text-center">色散与全息渐变</p>
            </div>
        </div>
    </section>

    <!-- Buttons -->
    <section class="relative py-12 px-6">
        <div class="max-w-5xl mx-auto">
            <h3 class="text-white/50 text-sm uppercase tracking-widest mb-8 text-center">按钮</h3>
            <div class="liquid-glass p-8">
                <div class="flex flex-wrap justify-center gap-4">
                    <button class="px-8 py-3 bg-white/20 backdrop-blur-xl rounded-full border border-white/30 text-white font-medium hover:bg-white/30 transition-all cursor-pointer">主要</button>
                    <button class="px-8 py-3 bg-gradient-to-r from-pink-500/50 to-purple-500/50 backdrop-blur-xl rounded-full border border-white/30 text-white font-medium hover:opacity-80 transition-all cursor-pointer">渐变</button>
                    <button class="px-8 py-3 backdrop-blur-xl rounded-full border-2 border-white/50 text-white font-medium hover:bg-white/10 transition-all cursor-pointer">描边</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Cards -->
    <section class="relative py-12 px-6">
        <div class="max-w-4xl mx-auto">
            <div class="grid grid-cols-2 gap-6">
                <div class="liquid-glass p-8 floating">
                    <div class="w-12 h-12 bg-gradient-to-br from-cyan-400 to-blue-500 rounded-xl mb-4"></div>
                    <h4 class="text-xl font-semibold text-white mb-2">流动动效</h4>
                    <p class="text-white/60 text-sm">400-600ms 曲线过渡</p>
                </div>
                <div class="liquid-glass p-8 floating" style="animation-delay: 1s;">
                    <div class="w-12 h-12 bg-gradient-to-br from-pink-400 to-purple-500 rounded-xl mb-4"></div>
                    <h4 class="text-xl font-semibold text-white mb-2">动态模糊</h4>
                    <p class="text-white/60 text-sm">用背景滤镜营造深度</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Form -->
    <section class="relative py-12 px-6">
        <div class="max-w-md mx-auto">
            <div class="liquid-glass p-8">
                <h3 class="text-xl font-semibold text-white mb-6 text-center">立即开始</h3>
                <div class="space-y-4">
                    <input type="email" placeholder="邮箱" class="w-full bg-white/10 backdrop-blur border border-white/30 rounded-2xl px-6 py-4 text-white placeholder-white/50 focus:outline-none focus:border-white/50">
                    <button class="w-full py-4 bg-white/90 text-purple-700 rounded-2xl font-semibold hover:bg-white transition-colors cursor-pointer">继续</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Info -->
    <section class="relative py-12 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="liquid-glass p-8">
                <div class="grid grid-cols-2 gap-8">
                    <div>
                        <h3 class="text-white/50 text-sm uppercase tracking-widest mb-4">适用场景</h3>
                        <ul class="space-y-2 text-white/80 text-sm">
                            <li>高端 SaaS</li>
                            <li>高端电商</li>
                            <li>创意平台</li>
                            <li>品牌体验</li>
                            <li>奢华作品集</li>
                        </ul>
                    </div>
                    <div>
                        <h3 class="text-white/50 text-sm uppercase tracking-widest mb-4">特征</h3>
                        <ul class="space-y-2 text-white/80 text-sm">
                            <li>性能：中等偏弱</li>
                            <li>无障碍：注意对比度</li>
                            <li>移动端：中等</li>
                            <li>复杂度：高</li>
                            <li>框架：Framer、GSAP</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="shared-footer" data-style="15" data-prev="14" data-prev-name="极光 UI" data-next="16" data-next-name="HUD 科幻"></div>

    <style>
        @keyframes aurora {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
    </style>
    <!-- PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Design Gallery">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">


    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('../sw.js').catch(() => {});
      }
    </script>

  <script src="../shared/components.js"></script>
</body>
</html>
