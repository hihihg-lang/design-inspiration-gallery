<style>
  :root {
    --bg: #fff;
    --text: #000;
    --muted: #6b7280;
    --border: #f3f4f6;
    --card-bg: #fff;
    --tag-bg: #f9fafb;
    --accent: #000;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  
  /* Header */
  .header { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 100; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
  .header h1 { font-size: 1.25rem; font-weight: 700; }
  .header nav { display: flex; gap: 24px; font-size: 0.875rem; }
  .header nav a { color: var(--muted); text-decoration: none; cursor: pointer; transition: color 0.2s; }
  .header nav a:hover, .header nav a.active { color: var(--text); font-weight: 600; }
  .lang-switch { display: flex; gap: 8px; align-items: center; font-size: 0.875rem; }
  .lang-switch a { color: var(--muted); text-decoration: none; cursor: pointer; }
  .lang-switch a.active { color: var(--text); font-weight: 600; }
  .lang-switch span { color: #d1d5db; }

  /* Hero */
  .hero { text-align: center; padding: 60px 0 40px; }
  .hero h2 { font-size: 2.5rem; font-weight: 800; margin-bottom: 16px; }
  .hero p { color: var(--muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

  /* Section */
  .section { padding: 40px 0; }
  .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
  .section-sub { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }

  /* Gallery Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card { border: 1px solid var(--border); border-radius: 16px; padding: 24px; background: var(--card-bg); cursor: pointer; transition: all 0.2s; }
  .card:hover { border-color: #d1d5db; box-shadow: 0 4px 16px rgba(0,0,0,0.04); transform: translateY(-2px); }
  .card-num { font-size: 0.75rem; color: #9ca3af; background: var(--tag-bg); display: inline-block; padding: 2px 8px; border-radius: 4px; margin-bottom: 12px; }
  .card h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
  .card .en-name { font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; }
  .card .desc { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
  .card .colors { display: flex; gap: 6px; margin-top: 12px; }
  .card .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 20px; padding: 40px; max-width: 700px; width: 90%; max-height: 85vh; overflow-y: auto; position: relative; }
  .modal-close { position: absolute; top: 16px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--muted); border: none; background: none; }
  .modal h3 { font-size: 1.75rem; font-weight: 800; margin-bottom: 4px; }
  .modal .en-name { color: var(--muted); margin-bottom: 20px; }
  .modal .preview-box { border-radius: 16px; padding: 40px; text-align: center; margin-bottom: 24px; font-size: 1.5rem; font-weight: 700; }
  .modal .desc-block { margin-bottom: 20px; }
  .modal .desc-block h4 { font-size: 0.8rem; text-transform: uppercase; color: #9ca3af; letter-spacing: 0.05em; margin-bottom: 6px; }
  .modal .desc-block p, .modal .desc-block li { font-size: 0.9rem; color: var(--muted); }
  .modal .desc-block ul { list-style: none; padding: 0; }
  .modal .desc-block li { padding: 2px 0; }
  .modal .desc-block li::before { content: "●"; margin-right: 8px; color: #d1d5db; font-size: 0.5rem; vertical-align: middle; }

  /* Palette */
  .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .palette-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .palette-swatch { height: 80px; display: flex; }
  .palette-swatch div { flex: 1; }
  .palette-info { padding: 12px; }
  .palette-info h4 { font-size: 0.9rem; font-weight: 600; }
  .palette-info p { font-size: 0.75rem; color: var(--muted); }

  /* Footer */
  .footer { border-top: 1px solid var(--border); padding: 24px 0; text-align: center; margin-top: 40px; }
  .footer p { font-size: 0.8rem; color: var(--muted); }

  /* Responsive */
  @media (max-width: 640px) {
    .hero h2 { font-size: 1.75rem; }
    .grid { grid-template-columns: 1fr; }
    .header nav { display: none; }
    .modal { padding: 24px; }
  }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
  .tab:hover { background: #f9fafb; }
  .tab.active { background: #000; color: #fff; border-color: #000; }
</style>

let currentLang = 'zh';

function switchLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-switch a').forEach(a => a.classList.remove('active'));
  document.querySelectorAll('.lang-switch a').forEach(a => {
    if (a.textContent.trim() === (lang === 'zh' ? '中文' : 'EN')) a.classList.add('active');
  });
  document.querySelectorAll('[data-zh][data-en]').forEach(el => {
    el.textContent = el.getAttribute('data-' + lang);
  });
  renderGallery();
  renderPalettes();
  renderPhilosophy();
}

function renderGallery() {
  const classic = STYLES.filter(s => s.cat === 'classic');
  const emerging = STYLES.filter(s => s.cat === 'emerging');
  document.getElementById('grid-classic').innerHTML = classic.map(s => cardHTML(s)).join('');
  document.getElementById('grid-emerging').innerHTML = emerging.map(s => cardHTML(s)).join('');
}

function cardHTML(s) {
  const name = currentLang === 'zh' ? s.zh : s.en;
  const enName = currentLang === 'zh' ? s.en : '';
  const desc = currentLang === 'zh' ? s.desc_zh : s.desc_en;
  return `<div class="card" onclick="openModal(${s.id})">
    <span class="card-num">${String(s.id).padStart(2,'0')}</span>
    <h3>${name}</h3>
    ${enName ? `<div class="en-name">${enName}</div>` : ''}
    <div class="desc">${desc.substring(0, 100)}...</div>
    <div class="colors">${s.colors.map(c => `<div class="color-dot" style="background:${c}"></div>`).join('')}</div>
  </div>`;
}

function openModal(id) {
  const s = STYLES.find(x => x.id === id);
  const name = currentLang === 'zh' ? s.zh : s.en;
  const enName = currentLang === 'zh' ? s.en : '';
  const desc = currentLang === 'zh' ? s.desc_zh : s.desc_en;
  const origin = currentLang === 'zh' ? s.origin_zh : s.origin_en;
  const principles = currentLang === 'zh' ? s.principles_zh : s.principles_en;
  const best = currentLang === 'zh' ? s.best_zh : s.best_en;
  const ux = currentLang === 'zh' ? s.ux_zh : s.ux_en;

  document.getElementById('modal-content').innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>${name}</h3>
    ${enName ? `<div class="en-name">${enName}</div>` : ''}
    <div class="preview-box" style="background:${s.preview}; color:${isLightBg(s) ? '#000' : '#fff'}">${s.preview_text}</div>
    <div class="desc-block"><h4>${currentLang === 'zh' ? '描述' : 'Description'}</h4><p>${desc}</p></div>
    <div class="desc-block"><h4>${currentLang === 'zh' ? '配色' : 'Colors'}</h4><div class="colors" style="margin-top:6px">${s.colors.map(c => `<div class="color-dot" style="background:${c};width:32px;height:32px" title="${c}"></div>`).join('')} <span style="font-size:0.8rem;color:var(--muted);margin-left:8px">${s.colors.join(', ')}</span></div></div>
    <div class="desc-block"><h4>${currentLang === 'zh' ? '起源' : 'Origin'}</h4><p>${origin}</p></div>
    <div class="desc-block"><h4>${currentLang === 'zh' ? '核心原则' : 'Core Principles'}</h4><ul>${principles.map(p => `<li>${p}</li>`).join('')}</ul></div>
    <div class="desc-block"><h4>${currentLang === 'zh' ? '最佳适用' : 'Best For'}</h4><p>${best}</p></div>
    <div class="desc-block"><h4>${currentLang === 'zh' ? 'UX 考量' : 'UX Considerations'}</h4><p>${ux}</p></div>
  `;
  document.getElementById('modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow = '';
}

function isLightBg(s) {
  const lightColors = ['#FFFFFF','#FFF','#F5F5F7','#F8F8F0','#FFF8E7','#F5F3EE','#F5F0E1','#FFFFD2','#FFF8E7'];
  return lightColors.some(c => s.preview.includes(c)) || s.preview.includes('#fff') || s.preview.includes('#FFF');
}

function renderPalettes() {
  const grids = [];
  STYLES.forEach(s => {
    const name = currentLang === 'zh' ? s.zh : s.en;
    grids.push(`<div class="palette-card">
      <div class="palette-swatch">${s.colors.map(c => `<div style="background:${c}"></div>`).join('')}</div>
      <div class="palette-info"><h4>${name}</h4><p>${s.colors.join(' · ')}</p></div>
    </div>`);
  });
  document.getElementById('palette-grid').innerHTML = grids.join('');
}

function renderPhilosophy() {
  const grids = [];
  STYLES.forEach(s => {
    const name = currentLang === 'zh' ? s.zh : s.en;
    const origin = currentLang === 'zh' ? s.origin_zh : s.origin_en;
    const principles = currentLang === 'zh' ? s.principles_zh : s.principles_en;
    const best = currentLang === 'zh' ? s.best_zh : s.best_en;
    const ux = currentLang === 'zh' ? s.ux_zh : s.ux_en;
    grids.push(`<div class="card" onclick="openModal(${s.id})">
      <span class="card-num">${String(s.id).padStart(2,'0')}</span>
      <h3>${name}</h3>
      <div class="desc" style="margin-top:8px"><strong>${currentLang === 'zh' ? '起源' : 'Origin'}:</strong> ${origin}</div>
      <div class="desc"><strong>${currentLang === 'zh' ? '原则' : 'Principles'}:</strong> ${principles.slice(0,2).join(' / ')}</div>
      <div class="desc"><strong>${currentLang === 'zh' ? '适用' : 'Best for'}:</strong> ${best}</div>
    </div>`);
  });
  document.getElementById('philosophy-grid').innerHTML = grids.join('');
}

function scrollToSection(id) {
  document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
  document.querySelectorAll('.header nav a').forEach(a => a.classList.remove('active'));
  document.querySelector(`.header nav a[href="#${id}"]`).classList.add('active');
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Init
renderGallery();
renderPalettes();
renderPhilosophy();
</script>
